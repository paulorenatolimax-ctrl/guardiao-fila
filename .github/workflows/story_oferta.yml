name: Story de oferta diario
on:
  schedule:
    - cron: "0 22 * * *"   # 19h BRT
  workflow_dispatch:
jobs:
  story:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicar_story_oferta.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - if: always()
        run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add story_oferta.json; git diff --staged --quiet || git commit -m "story de oferta publicado"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
