name: Publicar carrossel
on:
  schedule:
    - cron: '7-59/10 10-12 * * *'   # 7h-9h59 BRT, minutos quebrados
  workflow_dispatch:
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  carrossel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicar_carrossel.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add carrosseis.json
          git diff --staged --quiet && exit 0
          git commit -m "carrossel publicado: $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
