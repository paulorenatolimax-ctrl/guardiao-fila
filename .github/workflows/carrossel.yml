name: Publicar carrossel
on:
  schedule:
    # 03/10/2026: a cada 5 min, 7h00-23h59 BRT (10:00-02:59 UTC). Quem decide se publica é o
    # decidir.py (regra de recuperação: horário vencido e não publicado sai na próxima execução).
    - cron: '*/5 10-23 * * *'
    - cron: '*/5 0-2 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar agora mesmo, sem regra de horário?"
        type: boolean
        default: false
concurrency:
  group: publicar-carrossel
  cancel-in-progress: false
jobs:
  carrossel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pega o main da HORA em que roda (não o commit da hora do agendamento): evita repostar
      - run: python3 publicar_carrossel.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCAR: ${{ github.event.inputs.forcar }}
      - name: Postar na Página do Facebook (se o token existir)
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 publicar_facebook.py carrossel
      - name: Postar no X como fio (se as chaves existirem)
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: pip install --no-cache-dir -q requests-oauthlib && python3 publicar_x_carrossel.py
      - name: Postar no Threads (se o token existir)
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 publicar_threads.py carrossel
      - run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add carrosseis.json
          git diff --staged --quiet && exit 0
          git commit -m "carrossel publicado: $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
