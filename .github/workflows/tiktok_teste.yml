name: TikTok — teste manual
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "rascunho (cai nos rascunhos do app) ou direto (privado até a auditoria)"
        default: rascunho
permissions:
  contents: write
jobs:
  tiktok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar o Reel mais recente ao TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: ${{ inputs.modo }}
          RELEASE_TAG: videos
        run: python3 publicar_tiktok.py
      - name: Registrar
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json
          git diff --staged --quiet || git commit -m "tiktok: enviado $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
