name: Vigia do funil (caminho até a Hotmart)
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - id: teste
        run: python3 vigia_funil.py
      - name: Avisar o Paulo (issue = e-mail do GitHub)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "🚨 FUNIL QUEBRADO: alguém não chega na Hotmart ($(date -u +%d/%m %H:%M) UTC)" \
            --body "$(cat vigia_falhas.txt 2>/dev/null || echo 'ver o log do workflow')" || true
