name: Modelagem de perfil (sem login)
on:
  workflow_dispatch:
    inputs:
      perfil:
        default: adriano.proposito
      top:
        default: "100"
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q instaloader faster-whisper
      - env:
          PERFIL: ${{ inputs.perfil }}
          TOP: ${{ inputs.top }}
        run: python3 modelagem.py
      - if: always()
        run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add modelagem 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "modelagem: ${{ inputs.perfil }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
