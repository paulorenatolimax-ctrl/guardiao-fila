name: Modelagem de perfil
on:
  workflow_dispatch:
    inputs:
      perfil:
        description: "username do perfil"
        default: adriano.proposito
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PERFIL: ${{ inputs.perfil }}
        run: python3 descoberta.py
      - if: always()
        run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add descoberta_*.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "modelagem: ${{ inputs.perfil }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
