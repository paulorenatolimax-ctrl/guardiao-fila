name: Publicar Reel

on:
  schedule:
    # Só dispara DENTRO das 3 janelas (8h-9h, 13h-14h, 17h-18h BRT = 11h,
    # 16h, 20h UTC), a cada 12min, 5x por janela. decidir.py ainda filtra em
    # cima disso (janela certa + ainda não publicou hoje).
    #
    # Histórico: rodar a cada 17min o DIA TODO (85 disparos/dia) piorou tudo
    # — em 08/09/2026 o GitHub só executou 5 dos ~85 esperados, e 2 das 3
    # janelas ficaram sem nenhuma tentativa. Disparo frequente o dia inteiro
    # parece ter sido tratado como abuso pelo agendador. Restringir aos
    # horários que interessam (~15 disparos/dia) é a correção.
    - cron: '*/12 11,16,20 * * *'
  workflow_dispatch:        # permite disparar na mão pelo site

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decidir se é hora de publicar
        id: decidir
        run: python3 decidir.py
      - name: Conferir se os links estão vivos
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: python3 verificar_fila.py
      - name: Publicar o próximo da fila
        if: steps.decidir.outputs.deve_publicar == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RELEASE_TAG: videos
        run: python3 publicar.py
      - name: Registrar o que foi publicado
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json stats.json
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%d/%m %H:%M)"
          git push
