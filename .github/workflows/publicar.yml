name: Publicar Reel

on:
  schedule:
    # 03/10/2026: a cada 5 min, 7h00-23h59 BRT (10:00-02:59 UTC). Quem decide se publica é o
    # decidir.py (regra de recuperação: horário vencido e não publicado sai na próxima execução).
    - cron: '*/5 10-23 * * *'
    - cron: '*/5 0-2 * * *'
  workflow_dispatch:        # na mão segue a mesma regra; "forcar" publica sem regra
    inputs:
      forcar:
        description: "Publicar agora mesmo fora do horário (13h/19h)?"
        type: boolean
        default: false

concurrency:
  group: publicar-reel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pega o main da HORA em que roda (não o commit da hora do agendamento): evita repostar
      - name: Decidir se é hora de publicar
        id: decidir
        run: python3 decidir.py reel
        env:
          FORCAR: ${{ github.event.inputs.forcar }}
      - name: Conferir se os links estão vivos
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: python3 verificar_fila.py
      - name: Instalar dependências do YouTube
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: Publicar o próximo da fila (Instagram + YouTube)
        if: steps.decidir.outputs.deve_publicar == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RELEASE_TAG: videos
        run: python3 publicar.py
      - name: Postar no X (se as chaves existirem)
        if: steps.decidir.outputs.deve_publicar == 'true'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: pip install --no-cache-dir requests-oauthlib && python3 publicar_x.py
      - name: Postar na Página do Facebook (se o token existir)
        if: steps.decidir.outputs.deve_publicar == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          RELEASE_TAG: videos
        run: python3 publicar_facebook.py reel
      - name: Postar no Threads (se o token existir)
        if: steps.decidir.outputs.deve_publicar == 'true'
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          RELEASE_TAG: videos
        run: python3 publicar_threads.py reel
      - name: Enviar ao TikTok (se as chaves existirem)
        if: steps.decidir.outputs.deve_publicar == 'true'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: rascunho
          RELEASE_TAG: videos
        run: python3 publicar_tiktok.py
      - name: Registrar o que foi publicado
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json stats.json
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%d/%m %H:%M)"
          # se alguém gravou no repositório durante a publicação, junta e tenta de novo
          # (em 23/09 um push simples falhou e o 257 quase saiu duplicado)
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
