name: Publicar Reel

on:
  schedule:
    # Dispara a cada 15 min cobrindo as 3 janelas com tolerância a atrasos de runner:
    # 11,12 UTC = 08h às 10h BRT (manhã)
    # 16,17 UTC = 13h às 15h BRT (tarde: cobre 13h e 14h em cheio)
    # 20,21 UTC = 17h às 19h BRT (noite: cobre 17h e 18h em cheio)
    - cron: '*/15 11,12,16,17,20,21 * * *'
  workflow_dispatch:        # permite disparar na mão pelo site

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decidir se é hora de publicar
        id: decidir
        run: python3 decidir.py
      - name: Conferir se os links estão vivos
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: python3 verificar_fila.py
      - name: Publicar o próximo da fila
        if: steps.decidir.outputs.deve_publicar == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RELEASE_TAG: videos
        run: python3 publicar.py
      - name: Registrar o que foi publicado
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json stats.json
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%d/%m %H:%M)"
          git push
