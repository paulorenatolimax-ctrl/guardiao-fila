name: Publicar Reel

on:
  schedule:
    # A cada 10 min, em minutos "quebrados" (7, 17, 27...): o GitHub atrasa/pula os
    # agendamentos em :00/:15/:30/:45 (horário de pico). Cobre 07h-21h BRT (10h-00h UTC).
    # O decidir.py gerencia o filtro de janelas e o intervalo mínimo anti-duplicação.
    # Reforço: o Mac do Paulo confere às 8h40/13h40/17h40 e dispara se a janela não saiu.
    - cron: '7-59/10 10-23 * * *'
  workflow_dispatch:        # permite disparar na mão pelo site

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decidir se é hora de publicar
        id: decidir
        run: python3 decidir.py
      - name: Conferir se os links estão vivos
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: python3 verificar_fila.py
      - name: Instalar dependências do YouTube
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: pip install --no-cache-dir google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: Publicar o próximo da fila (Instagram + YouTube)
        if: steps.decidir.outputs.deve_publicar == 'true'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RELEASE_TAG: videos
        run: python3 publicar.py
      - name: Postar no X (se as chaves existirem)
        if: steps.decidir.outputs.deve_publicar == 'true'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: pip install --no-cache-dir requests-oauthlib && python3 publicar_x.py
      - name: Registrar o que foi publicado
        if: steps.decidir.outputs.deve_publicar == 'true'
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json stats.json
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%d/%m %H:%M)"
          # se alguém gravou no repositório durante a publicação, junta e tenta de novo
          # (em 23/09 um push simples falhou e o 257 quase saiu duplicado)
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
