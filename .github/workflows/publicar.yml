name: Publicar Reel

on:
  schedule:
    # ~8h, ~13h e ~17h no horário de Brasília (BRT = UTC-3).
    # Minuto deslocado de propósito: cron em minuto redondo (:00) cai no pico
    # de fila do GitHub Actions (todo mundo agenda assim) e atrasava 1h45-3h50.
    # Minuto "quebrado" sofre bem menos fila. Ainda é best-effort do GitHub,
    # sem garantia de horário exato.
    - cron: '7 11 * * *'    # ~08:07 BRT
    - cron: '13 16 * * *'   # ~13:13 BRT
    - cron: '22 20 * * *'   # ~17:22 BRT
  workflow_dispatch:        # permite disparar na mão pelo site

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Conferir se os links estão vivos
        run: python3 verificar_fila.py
      - name: Publicar o próximo da fila
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RELEASE_TAG: videos
        run: python3 publicar.py
      - name: Registrar o que foi publicado
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add fila.json
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%d/%m %H:%M)"
          git push
