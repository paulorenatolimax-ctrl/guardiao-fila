name: Publicar stories
on:
  workflow_dispatch:
jobs:
  stories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 publicar_story.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - if: always()
        run: |
          git config user.name "fila-guardiao"; git config user.email "actions@github.com"
          git add stories.json; git diff --staged --quiet || git commit -m "stories publicados"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
