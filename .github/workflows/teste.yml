name: Reel de teste (Trial)

on:
  schedule:
    # 01/10/2026: 3 Trial Reels por dia (só para NÃO seguidores), alvo 8h, 14h e 18h BRT.
    # Cron a cada 10 min cobrindo 7h-9h59, 13h-15h59 e 17h-19h59 BRT; o publicar_teste.py publica 1 por janela.
    - cron: '7-59/10 10-12,16-18,20-22 * * *'
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o Reel de teste (só Instagram)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RELEASE_TAG: videos
        run: python3 publicar_teste.py
      - name: Registrar o teste publicado
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add teste.json
          git diff --staged --quiet && exit 0
          git commit -m "teste publicado: $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
