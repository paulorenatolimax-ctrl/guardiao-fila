name: Reel de teste (Trial)

on:
  schedule:
    # 03/10/2026: a cada 5 min, 7h00-23h59 BRT (10:00-02:59 UTC). Quem decide se publica é o
    # decidir.py (regra de recuperação: horário vencido e não publicado sai na próxima execução).
    - cron: '*/5 10-23 * * *'
    - cron: '*/5 0-2 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar agora mesmo, sem regra de horário?"
        type: boolean
        default: false

concurrency:
  group: publicar-teste
  cancel-in-progress: false

jobs:
  teste:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pega o main da HORA em que roda (não o commit da hora do agendamento): evita repostar
      - name: Publicar o Reel de teste (só Instagram)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          RELEASE_TAG: videos
          FORCAR: ${{ github.event.inputs.forcar }}
        run: python3 publicar_teste.py
      - name: Registrar o teste publicado
        run: |
          git config user.name  "fila-guardiao"
          git config user.email "actions@github.com"
          git add teste.json
          git diff --staged --quiet && exit 0
          git commit -m "teste publicado: $(date -u +%d/%m %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
